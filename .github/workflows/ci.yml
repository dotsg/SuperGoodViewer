name: SoGoodViewer CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (Rust & Flutter)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rust Core Tests
        run: |
          cd core
          cargo test --verbose -- --nocapture

      - name: Build Rust Core Dynamic Library
        run: |
          cd core
          cargo build --release
          mkdir -p ../ui/macos ../ui/test
          cp target/release/libsogood_core.dylib ../ui/macos/
          cp target/release/libsogood_core.dylib ../ui/test/

      - name: Flutter Analysis & Tests
        run: |
          cd ui
          flutter pub get
          flutter analyze
          flutter test
