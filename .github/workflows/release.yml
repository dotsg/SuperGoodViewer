name: Release Multi-Platform App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Re-pushing the same tag cancels the superseded run instead of stacking builds.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================
  # macOS Build & Package (DMG Only)
  # =============================================================
  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: macos-arm64

      - name: Build Rust sogood_core (Release)
        run: |
          cd core
          cargo build --release

      - name: Build Flutter Desktop App (Release)
        run: |
          cd ui
          flutter pub get
          flutter build macos --release

      - name: Inject Dynamic Library & CLI Script into App Bundle
        run: |
          mkdir -p ui/build/macos/Build/Products/Release/sogoodviewer.app/Contents/Frameworks/
          cp core/target/release/libsogood_core.dylib ui/build/macos/Build/Products/Release/sogoodviewer.app/Contents/Frameworks/
          mkdir -p ui/build/macos/Build/Products/Release/sogoodviewer.app/Contents/Resources/bin/
          cp ui/bin/sgv ui/build/macos/Build/Products/Release/sogoodviewer.app/Contents/Resources/bin/sgv
          chmod +x ui/build/macos/Build/Products/Release/sogoodviewer.app/Contents/Resources/bin/sgv

      - name: Create macOS DMG Package
        run: |
          mkdir -p dist
          APP_PATH="ui/build/macos/Build/Products/Release/sogoodviewer.app"
          DMG_FILE="dist/SuperGoodViewer-${{ github.ref_name }}-macos.dmg"
          STAGING_DIR="dist/dmg_staging"

          echo "==> Preparing DMG staging directory with Applications shortcut..."
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/SuperGoodViewer.app"
          ln -s /Applications "$STAGING_DIR/Applications"

          echo "==> Creating DMG: $DMG_FILE"
          hdiutil create -volname "超好读 SuperGoodViewer" \
            -srcfolder "$STAGING_DIR" \
            -ov -format UDZO \
            "$DMG_FILE"
          rm -rf "$STAGING_DIR"


      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/*
          if-no-files-found: error

  # =============================================================
  # Windows Build & Package (x64 for Intel/AMD & ARM64 Prism)
  # =============================================================
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Exclude Rust target dir from Defender
        shell: pwsh
        continue-on-error: true
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}\core\target"

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: win-x64

      - name: Build Rust sogood_core (Release)
        shell: bash
        run: |
          cd core
          cargo build --release

      - name: Build Flutter Windows App (Release)
        shell: bash
        run: |
          cd ui
          flutter pub get
          flutter build windows --release

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $buildDir = "ui/build/windows/x64/runner/Release"
          $rustDll = "core/target/release/sogood_core.dll"

          # Copy Rust core dll next to executable
          Copy-Item -Path $rustDll -Destination $buildDir

          # Copy CLI launcher scripts into package
          Copy-Item -Path "ui/bin/sgv.cmd" -Destination $buildDir
          Copy-Item -Path "ui/bin/sgv.ps1" -Destination $buildDir

          # Compress to zip
          $zipName = "dist/SuperGoodViewer-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path "$buildDir/*" -DestinationPath $zipName
          Write-Host "Created Windows x64 package: $zipName"

      - name: Upload Windows x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-binaries
          path: dist/*
          if-no-files-found: error

  # =============================================================
  # Windows ARM64 Build & Package (Native WoA / Snapdragon X)
  # =============================================================
  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Exclude Rust target dir from Defender
        shell: pwsh
        continue-on-error: true
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}\core\target"

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: win-arm64

      - name: Build Rust sogood_core (ARM64 Release)
        shell: bash
        run: |
          cd core
          cargo build --release --target aarch64-pc-windows-msvc

      - name: Download Windows ARM64 Engine & PDFium Artifacts
        shell: pwsh
        run: |
          # Pre-generate Flutter Windows configuration, ephemeral files, and plugin symlinks
          cd ui
          flutter build windows --config-only
          cd ..

          if (-not $env:FLUTTER_ROOT) {
            $env:FLUTTER_ROOT = Split-Path (Split-Path (Get-Command flutter.bat).Source -Parent) -Parent
          }
          $engineHash = (flutter --version | Select-String 'Engine • hash ([0-9a-f]+)').Matches.Groups[1].Value
          $engineDir = "$env:FLUTTER_ROOT\bin\cache\artifacts\engine"
          New-Item -ItemType Directory -Force -Path "$engineDir\windows-arm64-release"
          New-Item -ItemType Directory -Force -Path "$engineDir\windows-arm64"
          
          # Download ARM64 Flutter engine
          curl.exe -L -o "$env:TEMP\engine_arm64.zip" "https://storage.googleapis.com/flutter_infra_release/flutter/$engineHash/windows-arm64-release/windows-arm64-flutter.zip"
          Expand-Archive -Force -Path "$env:TEMP\engine_arm64.zip" -DestinationPath "$engineDir\windows-arm64-release"
          
          # Download ARM64 CPP client wrapper
          curl.exe -L -o "$env:TEMP\wrapper_arm64.zip" "https://storage.googleapis.com/flutter_infra_release/flutter/$engineHash/windows-arm64/flutter-cpp-client-wrapper.zip"
          Expand-Archive -Force -Path "$env:TEMP\wrapper_arm64.zip" -DestinationPath "$engineDir\windows-arm64"
          
          # Copy icudtl.dat
          Copy-Item "$engineDir\windows-x64\icudtl.dat" "$engineDir\windows-arm64\icudtl.dat" -Force
          
          # Download ARM64 PDFium
          $pdfiumDir = "ui/.dart_tool/hooks_runner/shared/pdfium_dart/build/chromium_7811/win-arm64"
          New-Item -ItemType Directory -Force -Path $pdfiumDir
          curl.exe -L -o "$env:TEMP\pdfium_arm64.tgz" "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-win-arm64.tgz"
          tar.exe -zxvf "$env:TEMP\pdfium_arm64.tgz" -C $pdfiumDir bin/pdfium.dll
          Move-Item "$pdfiumDir/bin/pdfium.dll" "$pdfiumDir/pdfium.dll" -Force
          Remove-Item "$pdfiumDir/bin" -Recurse -Force

      - name: Build Flutter Windows ARM64 via CMake
        shell: pwsh
        run: |
          cd ui
          $env:JAVA_HOME = ""
          cmake -S windows -B build/windows_arm64 -A ARM64 -DFLUTTER_TARGET_PLATFORM=windows-arm64 -DCMAKE_DISABLE_FIND_PACKAGE_JNI=TRUE
          cmake --build build/windows_arm64 --config Release --target INSTALL

      - name: Package Windows ARM64 Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $buildDir = "ui/build/windows_arm64/runner/Release"
          Copy-Item -Path "core/target/aarch64-pc-windows-msvc/release/sogood_core.dll" -Destination $buildDir -Force
          Copy-Item -Path "ui/bin/sgv.cmd" -Destination $buildDir -Force
          Copy-Item -Path "ui/bin/sgv.ps1" -Destination $buildDir -Force
          $zipName = "dist/SuperGoodViewer-${{ github.ref_name }}-windows-arm64.zip"
          Compress-Archive -Path "$buildDir/*" -DestinationPath $zipName
          Write-Host "Created Windows ARM64 package: $zipName"

      - name: Upload Windows ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-binaries
          path: dist/*
          if-no-files-found: error

  # =============================================================
  # Publish Release
  # =============================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows-x64, build-windows-arm64]
    runs-on: ubuntu-latest

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Inspect artifacts
        run: |
          echo "Files to upload:"
          ls -lah release-artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "超好读 (SuperGoodViewer) ${{ github.ref_name }}"
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 超好读 (SuperGoodViewer) ${{ github.ref_name }} 正式发布！

            **只读 Markdown 矢量排版桌面阅读器**
            *Publication-Grade Typography, Pixel-Perfect Consistency, Zero-WebView Desktop Reader.*

            ---

            ### 📦 下载与安装指南

            #### 🍏 macOS 用户
            - **下载文件**：`SuperGoodViewer-${{ github.ref_name }}-macos.dmg`
            - **系统要求**：macOS 11.0+ (原生支持 Apple Silicon M 系列芯片与 Intel Mac)
            - **首次打开提示处理**：
              若系统提示「*无法验证开发者*」或「*已损坏，无法打开*」，请打开终端（Terminal）执行以下命令解除隔离属性即可：
              ```bash
              xattr -cr /Applications/SuperGoodViewer.app
              ```

            #### 🪟 Windows 用户
            - **Intel / AMD 64位 PC**：下载 `SuperGoodViewer-${{ github.ref_name }}-windows-x64.zip`
            - **高通骁龙 X / Surface 等 ARM64 设备**：下载 `SuperGoodViewer-${{ github.ref_name }}-windows-arm64.zip`（100% 纯原生 Native ARM64 架构，零转译开销与超高能效）
            - **使用方式**：解压 zip 包至任意目录，双击 `SuperGoodViewer.exe` 即可即开即用（绿色免安装便携版）；亦可将解压目录加入系统环境变量或使用内置的 `sgv.cmd` / `sgv.ps1` 命令行工具快速预览文档。
            - **首次运行提示**：如遇 Windows SmartScreen 提示拦截，点击「更多信息」并选择「仍要运行」。
