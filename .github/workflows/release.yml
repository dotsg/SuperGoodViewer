name: Release Multi-Platform App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.5)'
        required: true

permissions:
  contents: write

# Re-running the release cancels superseded builds for the same version
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  # =============================================================
  # macOS Build & Package (DMG Only)
  # =============================================================
  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify Release Version
        shell: bash
        run: |
          v="${RELEASE_VERSION}"
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version format: $v (expected vX.Y.Z)"; exit 1; }
          c=$(grep -m1 '^version' core/Cargo.toml | cut -d'"' -f2)
          [ "${v#v}" = "$c" ] || { echo "::error::$v != Cargo.toml $c"; exit 1; }
          p=$(grep -m1 '^version:' ui/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          [ "${v#v}" = "$p" ] || { echo "::error::$v != pubspec.yaml $p"; exit 1; }
          echo "Verified release version: $v (matches Cargo.toml $c, pubspec.yaml $p)"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: macos-universal

      - name: Build Rust sogood_core (Release, universal binary)
        # Flutter emits a universal Runner/engine for release macOS builds, so an
        # arm64-only dylib makes dlopen fail on Intel Macs with "Invalid arguments".
        run: |
          cd core
          cargo build --release --lib --bin sgv-cli --target aarch64-apple-darwin
          cargo build --release --lib --bin sgv-cli --target x86_64-apple-darwin
          mkdir -p target/universal/release
          lipo -create \
            target/aarch64-apple-darwin/release/libsogood_core.dylib \
            target/x86_64-apple-darwin/release/libsogood_core.dylib \
            -output target/universal/release/libsogood_core.dylib
          lipo -create \
            target/aarch64-apple-darwin/release/sgv-cli \
            target/x86_64-apple-darwin/release/sgv-cli \
            -output target/universal/release/sgv-cli
          lipo -info target/universal/release/libsogood_core.dylib
          lipo -info target/universal/release/sgv-cli

      - name: Build Flutter Desktop App (Release)
        run: |
          cd ui
          flutter pub get
          flutter build macos --release

      - name: Inject Dynamic Library & CLI Script into App Bundle
        run: |
          APP="ui/build/macos/Build/Products/Release/SuperGoodViewer.app"
          test -f "$APP/Contents/MacOS/SuperGoodViewer" || { echo "::error::$APP does not exist or executable is missing"; exit 1; }
          mkdir -p "$APP/Contents/Frameworks/"
          cp core/target/universal/release/libsogood_core.dylib "$APP/Contents/Frameworks/"
          # Fail loudly if the dylib is missing either architecture slice -- Intel or Apple Silicon would crash on launch.
          ARCHS=$(lipo -archs "$APP/Contents/Frameworks/libsogood_core.dylib")
          echo "libsogood_core.dylib architectures: $ARCHS"
          echo "$ARCHS" | grep -q x86_64 || { echo "::error::libsogood_core.dylib is missing the x86_64 slice"; exit 1; }
          echo "$ARCHS" | grep -q arm64 || { echo "::error::libsogood_core.dylib is missing the arm64 slice"; exit 1; }
          mkdir -p "$APP/Contents/Resources/bin/"
          cp ui/bin/sgv "$APP/Contents/Resources/bin/sgv"
          cp core/target/universal/release/sgv-cli "$APP/Contents/Resources/bin/sgv-cli"
          chmod +x "$APP/Contents/Resources/bin/sgv"
          chmod +x "$APP/Contents/Resources/bin/sgv-cli"
          # Re-sign app bundle after injecting dylib and CLI script so Gatekeeper doesn't reject modified code
          codesign --force --deep --sign - "$APP"

      - name: Create macOS DMG Package
        run: |
          mkdir -p dist
          APP_PATH="ui/build/macos/Build/Products/Release/SuperGoodViewer.app"
          test -f "$APP_PATH/Contents/MacOS/SuperGoodViewer" || { echo "::error::Binary missing in $APP_PATH"; exit 1; }
          DMG_FILE="dist/SuperGoodViewer-${{ env.RELEASE_VERSION }}-macos.dmg"
          STAGING_DIR="dist/dmg_staging"

          echo "==> Preparing DMG staging directory with Applications shortcut..."
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/SuperGoodViewer.app"
          ln -s /Applications "$STAGING_DIR/Applications"

          echo "==> Creating DMG: $DMG_FILE"
          hdiutil create -volname "超好读 SuperGoodViewer" \
            -srcfolder "$STAGING_DIR" \
            -ov -format UDZO \
            "$DMG_FILE"
          rm -rf "$STAGING_DIR"


      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-binaries
          path: dist/*
          if-no-files-found: error

  # =============================================================
  # Windows Build & Package (x64 for Intel/AMD & ARM64 Prism)
  # =============================================================
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify Release Version
        shell: bash
        run: |
          v="${RELEASE_VERSION}"
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version format: $v (expected vX.Y.Z)"; exit 1; }
          c=$(grep -m1 '^version' core/Cargo.toml | cut -d'"' -f2)
          [ "${v#v}" = "$c" ] || { echo "::error::$v != Cargo.toml $c"; exit 1; }
          p=$(grep -m1 '^version:' ui/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          [ "${v#v}" = "$p" ] || { echo "::error::$v != pubspec.yaml $p"; exit 1; }
          echo "Verified release version: $v (matches Cargo.toml $c, pubspec.yaml $p)"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Exclude Rust target dir from Defender
        shell: pwsh
        continue-on-error: true
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}\core\target"

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: win-x64

      - name: Build Rust sogood_core (Release)
        shell: bash
        run: |
          cd core
          cargo build --release

      - name: Build Flutter Windows App (Release)
        shell: bash
        run: |
          cd ui
          flutter pub get
          flutter build windows --release

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $buildDir = "ui/build/windows/x64/runner/Release"
          $rustDll = "core/target/release/sogood_core.dll"

          # Copy Rust core dll and sgv-cli next to executable
          Copy-Item -Path $rustDll -Destination $buildDir
          Copy-Item -Path "core/target/release/sgv-cli.exe" -Destination $buildDir

          # Copy CLI launcher scripts into package
          Copy-Item -Path "ui/bin/sgv.cmd" -Destination $buildDir
          Copy-Item -Path "ui/bin/sgv.ps1" -Destination $buildDir

          # Compress to zip
          $zipName = "dist/SuperGoodViewer-${{ env.RELEASE_VERSION }}-windows-x64.zip"
          Compress-Archive -Path "$buildDir/*" -DestinationPath $zipName
          Write-Host "Created Windows x64 package: $zipName"

      - name: Upload Windows x64 Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-binaries
          path: dist/*
          if-no-files-found: error

  # =============================================================
  # Windows ARM64 Build & Package (Native WoA / Snapdragon X)
  # =============================================================
  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify Release Version
        shell: bash
        run: |
          v="${RELEASE_VERSION}"
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version format: $v (expected vX.Y.Z)"; exit 1; }
          c=$(grep -m1 '^version' core/Cargo.toml | cut -d'"' -f2)
          [ "${v#v}" = "$c" ] || { echo "::error::$v != Cargo.toml $c"; exit 1; }
          p=$(grep -m1 '^version:' ui/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          [ "${v#v}" = "$p" ] || { echo "::error::$v != pubspec.yaml $p"; exit 1; }
          echo "Verified release version: $v (matches Cargo.toml $c, pubspec.yaml $p)"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Exclude Rust target dir from Defender
        shell: pwsh
        continue-on-error: true
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}\core\target"

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: win-arm64

      - name: Build Rust sogood_core (ARM64 Release)
        shell: bash
        run: |
          cd core
          cargo build --release --target aarch64-pc-windows-msvc

      - name: Download Windows ARM64 Engine & PDFium Artifacts
        shell: pwsh
        run: |
          # Pre-generate Flutter Windows configuration, ephemeral files, and plugin symlinks
          cd ui
          flutter build windows --config-only
          cd ..

          if (-not $env:FLUTTER_ROOT) {
            $env:FLUTTER_ROOT = Split-Path (Split-Path (Get-Command flutter.bat).Source -Parent) -Parent
          }
          $engineHash = (flutter --version | Select-String 'Engine • hash ([0-9a-f]+)').Matches.Groups[1].Value
          $engineDir = "$env:FLUTTER_ROOT\bin\cache\artifacts\engine"
          New-Item -ItemType Directory -Force -Path "$engineDir\windows-arm64-release"
          New-Item -ItemType Directory -Force -Path "$engineDir\windows-arm64"
          
          # Download ARM64 Flutter engine
          curl.exe -L -o "$env:TEMP\engine_arm64.zip" "https://storage.googleapis.com/flutter_infra_release/flutter/$engineHash/windows-arm64-release/windows-arm64-flutter.zip"
          Expand-Archive -Force -Path "$env:TEMP\engine_arm64.zip" -DestinationPath "$engineDir\windows-arm64-release"
          
          # Download ARM64 CPP client wrapper
          curl.exe -L -o "$env:TEMP\wrapper_arm64.zip" "https://storage.googleapis.com/flutter_infra_release/flutter/$engineHash/windows-arm64/flutter-cpp-client-wrapper.zip"
          Expand-Archive -Force -Path "$env:TEMP\wrapper_arm64.zip" -DestinationPath "$engineDir\windows-arm64"
          
          # Copy icudtl.dat
          Copy-Item "$engineDir\windows-x64\icudtl.dat" "$engineDir\windows-arm64\icudtl.dat" -Force
          
          # Download ARM64 PDFium
          $pdfiumDir = "ui/.dart_tool/hooks_runner/shared/pdfium_dart/build/chromium_7811/win-arm64"
          New-Item -ItemType Directory -Force -Path $pdfiumDir
          curl.exe -L -o "$env:TEMP\pdfium_arm64.tgz" "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-win-arm64.tgz"
          tar.exe -zxvf "$env:TEMP\pdfium_arm64.tgz" -C $pdfiumDir bin/pdfium.dll
          Move-Item "$pdfiumDir/bin/pdfium.dll" "$pdfiumDir/pdfium.dll" -Force
          Remove-Item "$pdfiumDir/bin" -Recurse -Force

      - name: Build Flutter Windows ARM64 via CMake
        shell: pwsh
        run: |
          cd ui
          $env:JAVA_HOME = ""
          cmake -S windows -B build/windows_arm64 -A ARM64 -DFLUTTER_TARGET_PLATFORM=windows-arm64 -DCMAKE_DISABLE_FIND_PACKAGE_JNI=TRUE
          cmake --build build/windows_arm64 --config Release --target INSTALL

      - name: Package Windows ARM64 Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $buildDir = "ui/build/windows_arm64/runner/Release"
          Copy-Item -Path "core/target/aarch64-pc-windows-msvc/release/sogood_core.dll" -Destination $buildDir -Force
          Copy-Item -Path "core/target/aarch64-pc-windows-msvc/release/sgv-cli.exe" -Destination $buildDir -Force
          Copy-Item -Path "ui/bin/sgv.cmd" -Destination $buildDir -Force
          Copy-Item -Path "ui/bin/sgv.ps1" -Destination $buildDir -Force
          $zipName = "dist/SuperGoodViewer-${{ env.RELEASE_VERSION }}-windows-arm64.zip"
          Compress-Archive -Path "$buildDir/*" -DestinationPath $zipName
          Write-Host "Created Windows ARM64 package: $zipName"

      - name: Upload Windows ARM64 Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-binaries
          path: dist/*
          if-no-files-found: error

  # =============================================================
  # Linux Build & Package (x64 portable tar.gz)
  # =============================================================
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify Release Version
        shell: bash
        run: |
          v="${RELEASE_VERSION}"
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version format: $v (expected vX.Y.Z)"; exit 1; }
          c=$(grep -m1 '^version' core/Cargo.toml | cut -d'"' -f2)
          [ "${v#v}" = "$c" ] || { echo "::error::$v != Cargo.toml $c"; exit 1; }
          p=$(grep -m1 '^version:' ui/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          [ "${v#v}" = "$p" ] || { echo "::error::$v != pubspec.yaml $p"; exit 1; }
          echo "Verified release version: $v (matches Cargo.toml $c, pubspec.yaml $p)"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: linux-x64

      - name: Build Rust sogood_core & sgv-cli (Release)
        run: |
          cd core
          cargo build --release

      - name: Build Flutter Desktop Linux App (Release)
        run: |
          cd ui
          flutter pub get
          flutter build linux --release

      - name: Package Linux Portable tar.gz
        run: |
          BUNDLE="ui/build/linux/x64/release/bundle"
          test -f "$BUNDLE/supergoodviewer" || { echo "::error::$BUNDLE/supergoodviewer missing"; exit 1; }
          test -f "$BUNDLE/lib/libsogood_core.so" || { echo "::error::$BUNDLE/lib/libsogood_core.so missing"; exit 1; }
          test -f "$BUNDLE/bin/sgv" || { echo "::error::$BUNDLE/bin/sgv missing"; exit 1; }
          test -x "$BUNDLE/bin/sgv" || { echo "::error::$BUNDLE/bin/sgv is not executable"; exit 1; }
          cp core/target/release/sgv-cli "$BUNDLE/bin/sgv-cli"
          chmod +x "$BUNDLE/bin/sgv-cli"
          test -f "$BUNDLE/bin/sgv-cli" || { echo "::error::$BUNDLE/bin/sgv-cli missing"; exit 1; }
          test -x "$BUNDLE/bin/sgv-cli" || { echo "::error::$BUNDLE/bin/sgv-cli is not executable"; exit 1; }
          mkdir -p dist
          tar -czvf "dist/SuperGoodViewer-${{ env.RELEASE_VERSION }}-linux-x64.tar.gz" -C "$BUNDLE" .

      - name: Upload Linux x64 Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-binaries
          path: dist/*
          if-no-files-found: error

  # =============================================================
  # Publish Release
  # =============================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows-x64, build-windows-arm64, build-linux-x64]
    runs-on: ubuntu-latest

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Inspect artifacts
        run: |
          echo "Files to upload:"
          ls -lah release-artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: "超好读 (SuperGoodViewer) ${{ env.RELEASE_VERSION }}"
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 超好读 (SuperGoodViewer) ${{ env.RELEASE_VERSION }} 正式发布！

            **只读 Markdown 矢量排版桌面阅读器**
            *Publication-Grade Typography, Pixel-Perfect Consistency, Zero-WebView Desktop Reader.*

            ---

            ### 📦 下载与安装指南

            #### 🍏 macOS 用户
            - **下载文件**：`SuperGoodViewer-${{ env.RELEASE_VERSION }}-macos.dmg`
            - **系统要求**：macOS 11.0+ (原生支持 Apple Silicon M 系列芯片与 Intel Mac)
            - **首次打开提示处理**：
              若系统提示「*无法验证开发者*」或「*已损坏，无法打开*」，请打开终端（Terminal）执行以下命令解除隔离属性即可：
              ```bash
              xattr -cr /Applications/SuperGoodViewer.app
              ```

            #### 🪟 Windows 用户
            - **Intel / AMD 64位 PC**：下载 `SuperGoodViewer-${{ env.RELEASE_VERSION }}-windows-x64.zip`
            - **高通骁龙 X / Surface 等 ARM64 设备**：下载 `SuperGoodViewer-${{ env.RELEASE_VERSION }}-windows-arm64.zip`（100% 纯原生 Native ARM64 架构，零转译开销与超高能效）
            - **使用方式**：解压 zip 包至任意目录，双击 `SuperGoodViewer.exe` 即可即开即用（绿色免安装便携版）；亦可将解压目录加入系统环境变量或使用内置的 `sgv.cmd` / `sgv.ps1` 命令行工具快速预览文档。
            - **首次运行提示**：如遇 Windows SmartScreen 提示拦截，点击「更多信息」并选择「仍要运行」。

            #### 🐧 Linux 用户
            - **Intel / AMD 64位 Linux**：下载 `SuperGoodViewer-${{ env.RELEASE_VERSION }}-linux-x64.tar.gz`
            - **系统要求**：Ubuntu 20.04+、Debian 11+、Fedora、Arch Linux 等主流 64 位发行版（需安装 GTK 3 环境）
            - **使用方式**：解压 tar.gz 归档至任意目录，运行 `./supergoodviewer` 即可直接启动（绿色免安装）；亦可将解压目录中的 `bin/sgv` 脚本软链接至 `~/.local/bin/sgv`，在终端随时以命令行唤起。
