[package]
name = "sogood_core"
version = "0.1.0"
edition = "2024"

[lib]
name = "sogood_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-syntax = "0.15.1"
pulldown-cmark = { version = "0.13" }
mitex = "0.2"
mermaid-rs-renderer = { version = "0.3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
typst-assets = { version = "0.15.1", features = ["fonts"] }
fontdb = "0.23"

parking_lot = "0.12"
thiserror = "2.0"

[dev-dependencies]
ttf-parser = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

